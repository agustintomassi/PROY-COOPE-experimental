<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso</title>

  <link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* Mismos colores que el formulario: si cambiás la paleta allá, cambiala acá también */
    :root {
      --brand: #e2483d;
      --brand-dark: #bf352c;
      --band: #f8c7a6;
      --panel: #fdeee3;
      --ink: #2b1d1a;
      --bg: #fbf6f2;
    }

    body {
      font-family: 'Roboto', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;       /* centra la tarjeta en la pantalla */
      justify-content: center;
      padding: 1rem;
    }

    .app-card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(120, 50, 30, .13);
    }

    /* Logo grande y centrado */
    .logo-hero {
      text-align: center;
      padding: 2rem 1rem 1.5rem;
    }
    .logo-hero img {
      width: min(210px, 70%);
      height: auto;
    }

    .title-band {
      background: var(--band);
      text-align: center;
      padding: .8rem 1rem;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: .01em;
      margin: 0;
    }

    .form-body { padding: .9rem; }

    .section {
      background: var(--panel);
      border-radius: 1rem;
      padding: 1.1rem 1rem 1.25rem;
    }
    .section h2 {
      font-size: 1.15rem;
      font-weight: 700;
      text-align: center;
      margin: 0 0 .9rem;
    }

    /* Campo del PIN: grande, centrado, con los puntos bien separados */
    .pin-input {
      border-radius: .9rem;
      border: 1px solid #e3c4b3;
      padding: .7rem .8rem;
      font-size: 2rem;            /* 16px o más evita el zoom en iOS */
      font-weight: 500;
      text-align: center;
      letter-spacing: .55em;
      text-indent: .55em;         /* compensa el espacio final para que quede centrado */
    }
    .pin-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 .22rem rgba(226, 72, 61, .22);
    }
    .pin-input.con-error { animation: sacudir .35s; border-color: var(--brand); }

    @keyframes sacudir {
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pin-input.con-error { animation: none; }
    }

    .mensaje-error {
      background: #fde2e0;
      color: #8a1f17;
      border-radius: .8rem;
      padding: .65rem 1rem;
      text-align: center;
      font-weight: 500;
      margin-bottom: .9rem;
    }

    .btn-brand {
      background: var(--brand);
      border: 0;
      color: #fff;
      font-weight: 700;
      letter-spacing: .02em;
      border-radius: 999px;
      padding: .85rem 1rem;
      box-shadow: 0 6px 14px rgba(226, 72, 61, .32);
      transition: background .15s, transform .1s;
    }
    .btn-brand:hover, .btn-brand:focus { background: var(--brand-dark); color: #fff; }
    .btn-brand:active { transform: scale(.98); }
  </style>
</head>
<body>

  <main class="app-card">

    <div class="logo-hero">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="ISFT N° 12">
    </div>

    <h1 class="title-band">ACCESO</h1>

    <form id="acceso" class="form-body" method="post" action="{{ url_for('login') }}" autocomplete="off">
      <div class="section">
        <h2>Ingresá el PIN</h2>

        {% if error %}
          <div class="mensaje-error" role="alert">{{ error }}</div>
        {% endif %}

        <input type="password" id="pin" name="pin"
               class="form-control pin-input{% if error %} con-error{% endif %}"
               inputmode="numeric" pattern="[0-9]*" maxlength="4"
               autocomplete="one-time-code" aria-label="PIN de 4 dígitos"
               autofocus required>
      </div>

      <div class="d-grid mt-3">
        <button type="submit" class="btn btn-brand btn-lg">ENTRAR</button>
      </div>
    </form>
  </main>

  <script>
    const pin = document.getElementById('pin');

    // Solo permite números; para entrar hay que apretar ENTRAR (o Enter en el teclado)
    pin.addEventListener('input', () => {
      pin.value = pin.value.replace(/\D/g, '');
    });
  </script>
</body>
</html>
